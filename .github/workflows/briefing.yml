name: Daily Investor Briefing

on:
  schedule:
    # 早报: 提前到 UTC 21:00（北京 05:00）启动，等待到北京 08:00 执行
    - cron: '0 21 * * *'
    # 晚报: 提前到 UTC 09:00（北京 17:00）启动，等待到北京 20:00 执行
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      type:
        description: 'Briefing type: morning or afternoon'
        required: true
        default: 'morning'

jobs:
  morning:
    if: github.event.inputs.type == 'morning' || (github.event_name == 'schedule' && github.event.schedule == '0 21 * * *')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests APScheduler
      - name: Wait until Beijing 08:00
        run: |
          TARGET_HOUR=8
          TARGET_MIN=0
          # 当前 UTC 时间
          NOW=$(date -u +%s)
          # 计算目标北京时间今天的秒数（UTC+8）
          BEIJING_DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          TARGET_SEC=$(TZ=Asia/Shanghai date -d "${BEIJING_DATE} ${TARGET_HOUR}:${TARGET_MIN}:00" +%s)
          # 如果目标时间已过（cron 延迟超过7小时），直接执行
          DIFF=$((TARGET_SEC - NOW))
          if [ $DIFF -le 0 ]; then
            echo "Target time already passed, running now"
            exit 0
          fi
          echo "Waiting ${DIFF} seconds until Beijing ${TARGET_HOUR}:$(printf '%02d' $TARGET_MIN)..."
          sleep $DIFF
      - run: python main.py now morning
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          TZ: Asia/Shanghai

  afternoon:
    if: github.event.inputs.type == 'afternoon' || (github.event_name == 'schedule' && github.event.schedule == '0 9 * * *')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests APScheduler
      - name: Wait until Beijing 20:00
        run: |
          TARGET_HOUR=20
          TARGET_MIN=0
          NOW=$(date -u +%s)
          BEIJING_DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          TARGET_SEC=$(TZ=Asia/Shanghai date -d "${BEIJING_DATE} ${TARGET_HOUR}:${TARGET_MIN}:00" +%s)
          DIFF=$((TARGET_SEC - NOW))
          if [ $DIFF -le 0 ]; then
            echo "Target time already passed, running now"
            exit 0
          fi
          echo "Waiting ${DIFF} seconds until Beijing ${TARGET_HOUR}:$(printf '%02d' $TARGET_MIN)..."
          sleep $DIFF
      - run: python main.py now afternoon
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          TZ: Asia/Shanghai
