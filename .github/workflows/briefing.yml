name: Daily Investor Briefing

on:
  schedule:
    # 早报: UTC 00:00 = 北京时间 08:00
    - cron: '0 0 * * *'
    # 晚报: UTC 12:00 = 北京时间 20:00
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      type:
        description: 'Briefing type: morning or afternoon'
        required: true
        default: 'morning'

jobs:
  morning:
    if: github.event.inputs.type == 'morning' || (github.event_name == 'schedule' && github.event.schedule == '0 0 * * *')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests APScheduler
      - run: python main.py now morning
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}

  afternoon:
    if: github.event.inputs.type == 'afternoon' || (github.event_name == 'schedule' && github.event.schedule == '0 12 * * *')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests APScheduler
      - run: python main.py now afternoon
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
